name: Build NanoGram Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Standalone Release (ARM64-v8a)
        run: ./gradlew :TMessagesProj_AppStandalone:assembleArm64Release --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NanoGram-arm64-v8a-release
          path: TMessagesProj_AppStandalone/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
